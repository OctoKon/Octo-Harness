[package]
name = "splyce-desktop"
version = "0.1.0"
description = "Splyce Windows desktop shell"
edition = "2024"
rust-version = "1.90"
license = "AGPL-3.0-only"

[lib]
name = "splyce_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
sha2 = "=0.11.1"
tauri-build = { version = "=2.7.4", features = [] }

[dependencies]
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
sha2 = "=0.11.1"
tauri = { version = "=2.12.5", features = [] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "=0.61.2", features = ["Win32_Foundation", "Win32_Security", "Win32_Storage_FileSystem", "Win32_System_IO", "Win32_System_JobObjects", "Win32_System_Pipes", "Win32_System_SystemInformation", "Win32_System_Threading"] }
