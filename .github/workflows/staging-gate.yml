name: Staging release gate

# Runs the full release gate on every staging head. Promotion to main requires this check.
on:
  pull_request:
    branches: [staging]
  push:
    branches: [staging]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: staging-gate-${{ github.ref }}
  # Never cancel a running staging push gate; superseded PR runs may be cancelled.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  contracts:
    name: Shared contracts
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run test:contracts -- --case TD-01

  staging-release-gate:
    name: Staging release gate
    needs: contracts
    runs-on: windows-latest
    timeout-minutes: 120
    env:
      RUSTUP_TOOLCHAIN: 1.99.1
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: npm
      - name: Install the pinned Rust toolchain
        run: rustup toolchain install 1.99.1 --profile minimal --target x86_64-pc-windows-msvc
      - name: Prepare checksum-verified Node and npm
        run: |
          npm run prepare:runtime
          echo "$GITHUB_WORKSPACE/apps/desktop/src-tauri/resources/engine" >> "$GITHUB_PATH"
          echo "$GITHUB_WORKSPACE/apps/desktop/src-tauri/target/build-tools" >> "$GITHUB_PATH"
      - name: Install locked Node dependencies
        run: npm ci --ignore-scripts
      - name: Build the uninstrumented release app
        run: npm run build:desktop
      - name: Run Rust tests
        run: cargo test --locked --manifest-path apps/desktop/src-tauri/Cargo.toml
      - name: Install pinned external release-smoke drivers
        run: |
          cargo install tauri-driver --version 2.1.0 --locked --root apps/desktop/src-tauri/target/smoke-tools --target-dir apps/desktop/src-tauri/target/smoke-driver-build
          mkdir -p apps/desktop/src-tauri/target/smoke-tools/edge-155.0.4283.62
          curl --fail --location --silent --show-error https://msedgedriver.microsoft.com/155.0.4283.62/edgedriver_win64.zip --output "$RUNNER_TEMP/edgedriver.zip"
          echo "00dd7fbc6fc4bd68e6e86badbe76e6570513414085f476e73d3787ba3410d562  $RUNNER_TEMP/edgedriver.zip" | sha256sum --check
          unzip -q -o "$RUNNER_TEMP/edgedriver.zip" -d apps/desktop/src-tauri/target/smoke-tools/edge-155.0.4283.62
      - name: Run release and embedded desktop gates
        env:
          SPLYCE_TAURI_DRIVER: ${{ github.workspace }}/apps/desktop/src-tauri/target/smoke-tools/bin/tauri-driver.exe
          SPLYCE_EDGE_DRIVER: ${{ github.workspace }}/apps/desktop/src-tauri/target/smoke-tools/edge-155.0.4283.62/msedgedriver.exe
        run: |
          # Once defined, the release gate always runs; path detection only decides whether a missing script is an error.
          if node -e "process.exit(require('./package.json').scripts?.['test:release-gate'] ? 0 : 1)"; then
            npm run test:release-gate
            exit 0
          fi
          # UI prototypes under apps/desktop/prototype/ are non-product fixtures, not runtime source.
          if [ -n "$(git ls-files -- apps packages vendor ':!apps/desktop/prototype')" ]; then
            echo "::error::Runtime source exists but package.json has no test:release-gate script (TD-01 creates it; TD-11 and TD-80 extend it)."
            exit 1
          fi
          echo "Runtime E2E N/A: no test:release-gate script and no runtime source under apps/, packages/ or vendor/." >> "$GITHUB_STEP_SUMMARY"
