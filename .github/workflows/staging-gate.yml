name: Staging release gate

# Runs the full release gate on every staging head. Promotion to main requires this check.
on:
  pull_request:
    branches: [staging]
  push:
    branches: [staging]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: staging-gate-${{ github.ref }}
  # Never cancel a running staging push gate; superseded PR runs may be cancelled.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  contracts:
    name: Shared contracts
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run test:contracts -- --case TD-01

  staging-release-gate:
    name: Staging release gate
    needs: contracts
    runs-on: windows-latest
    timeout-minutes: 120
    env:
      RUSTUP_TOOLCHAIN: 1.99.1
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: npm
      - name: Install the pinned Rust toolchain
        run: rustup toolchain install 1.99.1 --profile minimal --target x86_64-pc-windows-msvc
      - name: Prepare checksum-verified Node and npm
        run: |
          npm run prepare:runtime
          echo "$GITHUB_WORKSPACE/apps/desktop/src-tauri/resources/engine" >> "$GITHUB_PATH"
          echo "$GITHUB_WORKSPACE/apps/desktop/src-tauri/target/build-tools" >> "$GITHUB_PATH"
      - name: Install locked Node dependencies
        run: npm ci --ignore-scripts
      - name: Hydrate pinned Pi model data
        run: node vendor/pi/scripts/update-model-catalog-pin.mjs --hydrate-pinned
      - name: Build the uninstrumented release app
        run: npm run build:desktop
      - name: Run Rust tests
        run: cargo test --locked --manifest-path apps/desktop/src-tauri/Cargo.toml
      - name: Test release-smoke preparation guards
        shell: pwsh
        run: ./tests/bootstrap/prepare-release-drivers.ps1 -TestOnly
      - name: Build and qualify per-run release-smoke drivers
        shell: pwsh
        run: ./tests/bootstrap/prepare-release-drivers.ps1
      - name: Run release and embedded desktop gates
        id: release-gates
        run: |
          # Once defined, the release gate always runs; path detection only decides whether a missing script is an error.
          if node -e "process.exit(require('./package.json').scripts?.['test:release-gate'] ? 0 : 1)"; then
            npm run test:release-gate
            exit 0
          fi
          # UI prototypes under apps/desktop/prototype/ are non-product fixtures, not runtime source.
          if [ -n "$(git ls-files -- apps packages vendor ':!apps/desktop/prototype')" ]; then
            echo "::error::Runtime source exists but package.json has no test:release-gate script (TD-01 creates it; TD-11 and TD-80 extend it)."
            exit 1
          fi
          echo "Runtime E2E N/A: no test:release-gate script and no runtime source under apps/, packages/ or vendor/." >> "$GITHUB_STEP_SUMMARY"
      - name: Compare fresh-profile baseline and GPU diagnostic after failure
        if: failure() && steps.release-gates.outcome == 'failure'
        shell: pwsh
        run: |
          # Both diagnostic runs keep the same app, drivers, assertions and 20-second budget.
          # The primary gate above remains failed regardless of these results.
          $smokeRoot = Join-Path $env:GITHUB_WORKSPACE 'apps/desktop/src-tauri/target/bootstrap-smoke'
          $diagnosticRoot = Join-Path $env:GITHUB_WORKSPACE 'apps/desktop/src-tauri/target/smoke-comparison'
          foreach ($variant in @('baseline', 'disable-gpu')) {
            $env:WEBVIEW2_USER_DATA_FOLDER = Join-Path $env:RUNNER_TEMP ("splyce-smoke-" + [guid]::NewGuid())
            $env:WEBVIEW2_ADDITIONAL_BROWSER_ARGUMENTS = if ($variant -eq 'disable-gpu') { '--disable-gpu' } else { '' }
            $before = @(Get-ChildItem -LiteralPath $smokeRoot -Directory -ErrorAction SilentlyContinue | ForEach-Object Name)
            & ./apps/desktop/src-tauri/resources/engine/node.exe tests/bootstrap/release-smoke.mjs
            $smokeExit = $LASTEXITCODE
            $created = @(Get-ChildItem -LiteralPath $smokeRoot -Directory | Where-Object Name -NotIn $before)
            if ($created.Count -ne 1) { throw 'Expected exactly one diagnostic smoke directory' }
            $destination = Join-Path $diagnosticRoot $variant
            New-Item -ItemType Directory -Path $destination -Force | Out-Null
            foreach ($name in @('result.json', 'driver.log')) {
              Copy-Item -LiteralPath (Join-Path $created[0].FullName "diagnostics/$name") -Destination $destination
            }
            "Diagnostic $variant exit=$smokeExit (does not change the primary gate)" >> $env:GITHUB_STEP_SUMMARY
          }
          exit 0
      - name: Retain sanitized profile and GPU comparison
        if: failure() && steps.release-gates.outcome == 'failure'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-smoke-comparison-${{ github.sha }}
          path: apps/desktop/src-tauri/target/smoke-comparison/*/*
          if-no-files-found: warn
          retention-days: 3
      - name: Retain sanitized release-smoke failure diagnostics
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-smoke-diagnostics-${{ github.sha }}
          path: apps/desktop/src-tauri/target/bootstrap-smoke/*/diagnostics/*
          if-no-files-found: warn
          retention-days: 3
