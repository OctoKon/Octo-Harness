name: Documentation quality

on:
  pull_request:
  push:
    branches: [main, staging]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: documentation-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  windows-token-observation:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/sreerevanth/td11-ci-portability'
    runs-on: windows-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Observe current process token without changing it
        shell: pwsh
        run: |
          $created = [DateTimeOffset](Get-Process -Id $PID).StartTime
          $result = & ./tests/bootstrap/process-elevation.ps1 -ProcessId $PID -CreationTimeMs $created.ToUnixTimeMilliseconds() -Details | ConvertFrom-Json
          $result | ConvertTo-Json -Compress
          if ($result.status -ne 'observed' -or $null -eq $result.elevationType) {
            throw 'Token observation unavailable; this is not a non-elevated launch test.'
          }

  documentation-quality:
    name: Documentation quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Review dependency changes
        if: github.event_name == 'pull_request'
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: moderate
          fail-on-scopes: runtime, development, unknown
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - run: npm ci --ignore-scripts
      - run: npm run format:check
      - run: npm run lint:markdown
      - run: npm run check:docs
      - run: npm run test:docs

  deploy-pages:
    needs: documentation-quality
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: ./.github/workflows/static.yml
